<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111318">
    <meta name="description" content="YpChat - Firebase realtime chat">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <title>YpChat</title>
</head>
<body>
<div id="app">
    <header class="topbar">
        <div class="logo">YpChat</div>
        <div class="top-actions">
            <span id="connectionStatus">接続中...</span>
            <button id="settingsButton" title="設定">⚙️</button>
            <button id="profileButton" title="プロフィール">👤</button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <button class="nav-button active" data-page="home">🏠 ホーム</button>
            <button class="nav-button" data-page="rooms">💬 ルーム</button>
            <button class="nav-button" data-page="friends">🟢 フレンド</button>
            <button class="nav-button" data-page="dm">💌 DM</button>

            <hr>

            <div class="section-title">参加中のルーム</div>
            <div id="roomList"></div>

            <button id="createRoomButton" class="create-button">＋ ルームを作成</button>
            <button id="joinRoomButton" class="secondary-button">🔑 コードで参加</button>
        </aside>

        <main class="main">
            <section id="homePage" class="page">
                <div class="welcome">
                    <h1>YpChatへようこそ！</h1>
                    <p>ログイン不要。匿名でチャットできます。</p>
                    <div class="join-box">
                        <input id="homeRoomCode" maxlength="12" placeholder="ルームコード">
                        <button id="homeJoinButton">参加</button>
                    </div>
                </div>

                <div class="card">
                    <h2>公開ルーム</h2>
                    <div id="publicRooms"></div>
                </div>
            </section>

            <section id="chatPage" class="page hidden">
                <div class="chat-header">
                    <div>
                        <h2 id="currentRoomName">ルーム</h2>
                        <span id="roomMemberCount"></span>
                    </div>
                    <div class="chat-header-actions">
                        <button id="streamButton">🎥 配信</button>
                        <button id="roomSettingsButton">⚙️</button>
                    </div>
                </div>

                <div id="messages" class="messages"></div>

                <div id="typingStatus" class="typing-status"></div>

                <div class="composer">
                    <button id="stampButton" title="スタンプ">😀</button>
                    <textarea id="messageInput" placeholder="メッセージ… Markdown対応" rows="1"></textarea>
                    <button id="sendButton" title="送信">➤</button>
                </div>
            </section>

            <section id="roomsPage" class="page hidden">
                <h1>💬 ルーム</h1>
                <div class="join-box">
                    <input id="roomCodeInput" maxlength="12" placeholder="ルームコード">
                    <button id="joinRoomPageButton">参加</button>
                </div>
                <div class="card">
                    <h2>公開ルーム</h2>
                    <div id="publicRoomsPage"></div>
                </div>
            </section>

            <section id="friendsPage" class="page hidden">
                <h1>🟢 フレンド</h1>
                <div class="friend-search">
                    <input id="friendSearchInput" placeholder="名前で検索">
                    <button id="friendSearchButton">検索</button>
                </div>
                <div id="friendResults"></div>
                <h2>フレンド一覧</h2>
                <div id="friendsList"></div>
            </section>

            <section id="dmPage" class="page hidden">
                <h1>💌 DM</h1>
                <div id="dmList"></div>
                <div id="dmChat" class="hidden">
                    <div class="chat-header">
                        <h2 id="dmTargetName">DM</h2>
                    </div>
                    <div id="dmMessages" class="messages dm-messages"></div>
                    <div class="composer">
                        <textarea id="dmInput" placeholder="メッセージ…" rows="1"></textarea>
                        <button id="dmSendButton">➤</button>
                    </div>
                </div>
            </section>

            <section id="profilePage" class="page hidden">
                <h1>👤 プロフィール</h1>
                <div class="card profile-card">
                    <label>表示名
                        <input id="displayNameInput" maxlength="32">
                    </label>

                    <label>プレート色
                        <input id="plateColorInput" type="color">
                    </label>

                    <label>フォント
                        <select id="fontInput">
                            <option value="system">標準</option>
                            <option value="sans-serif">Sans Serif</option>
                            <option value="serif">Serif</option>
                            <option value="monospace">Monospace</option>
                        </select>
                    </label>

                    <label>ステータス
                        <select id="statusInput">
                            <option value="online">🟢 オンライン</option>
                            <option value="away">🟡 離席中</option>
                            <option value="dnd">🔴 取り込み中</option>
                            <option value="invisible">⚪ オフライン表示</option>
                    </select>
                    </label>

                    <label>DM受付
                        <select id="dmPolicyInput">
                            <option value="friends">フレンドのみ</option>
                            <option value="everyone">誰でも</option>
                            <option value="none">誰からも受け付けない</option>
                        </select>
                    </label>

                    <button id="saveProfileButton">保存</button>
                </div>
            </section>

            <section id="settingsPage" class="page hidden">
                <h1>⚙️ 設定</h1>
                <div class="card">
                    <label><input id="notificationToggle" type="checkbox"> プッシュ通知を有効にする</label>
                    <button id="enableNotificationButton">🔔 通知を許可</button>
                </div>
            </section>
        </main>
    </div>
</div>

<div id="modal" class="modal hidden">
    <div class="modal-card">
        <button id="modalClose" class="modal-close">×</button>
        <div id="modalContent"></div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
